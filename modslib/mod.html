<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري إعادة التوجيه...</title>
    <script>
        // استخراج قيمة الـ id من رابط الصفحة الحالي
        const urlParams = new URLSearchParams(window.location.search);
        const fileId = urlParams.get('id');

        if (fileId) {
            // إذا كان الـ id موجوداً، يتم توجيه المستخدم إلى الرابط المحدد مع وضع الرقم مكانه
            window.location.replace("https://modslib.attdes.online/a/" + fileId + ".html");
        } else {
            // في حال لم يتم العثور على الـ id في الرابط
            document.write("عذراً، لم يتم تحديد رقم الملف المطلوب.");
        }
    </script>
</head>
<body>
    <noscript>
        <p>يرجى تفعيل الجافا سكريبت ليتم إعادة توجيهك تلقائياً.</p>
    </noscript>
</body>
</html>
