<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد أوامر Edge-TTS</title>
    <style>
        :root {
            --primary: #ffee00;
            --primary-hover: #d4c800;
            --bg: #000000;
            --card-bg: #0d0d0d;
            --text: #ffffff;
            --text-muted: #a3a3a3;
            --border: #2b2b00;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, #1a1a00 0%, #000 60%);
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border: 1px solid #333300;
            border-radius: 4px;
            padding: 24px;
            box-shadow: 0 0 25px rgba(255, 238, 0, 0.15), 0 10px 25px -5px rgba(0, 0, 0, 0.8);
        }
        h2 {
            margin-bottom: 20px;
            font-size: 1.8rem;
            text-align: center;
            color: var(--primary);
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #333;
        }
        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--primary);
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid #4a4a00;
            border-radius: 2px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(255, 238, 0, 0.4);
        }
        textarea { resize: vertical; min-height: 120px; }
        .output-box {
            margin-top: 24px;
            background: #000;
            border: 1px dashed var(--primary);
            border-radius: 4px;
            padding: 16px;
            position: relative;
        }
        pre {
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
            font-family: monospace;
            font-size: 0.85rem;
            line-height: 1.7;
            color: var(--primary);
            margin-bottom: 12px;
            direction: ltr;
            text-align: left;
        }
        .btn {
            background-color: var(--primary);
            color: #000;
            border: none;
            border-radius: 2px;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:hover {
            background-color: #fff;
            color: #000;
            box-shadow: 0 0 15px rgba(255,238,0,0.6);
        }
        .btn-success { background-color: #fff !important; color: #000 !important; }
        .info { margin-top: 8px; color: var(--text-muted); font-size: 0.8rem; }
        select option { background: #000; color: #ffee00; }
    </style>
</head>
<body>
<div class="container">
<h2>TTS COMMAND GENERATOR</h2>
<div class="form-group">
    <label for="textInput">النص المراد تحويله:</label>
    <textarea id="textInput" placeholder="اكتب النص هنا..." oninput="generateCommand()"></textarea>
</div>
<div class="form-group">
    <label for="fileNameInput">اسم الملف:</label>
    <input type="text" id="fileNameInput" placeholder="مثال: audio_file" oninput="generateCommand()">
    <div class="info">سيتم تحويل "_" إلى مسافة في اسم العنوان داخل البيانات الوصفية (Metadata).</div>
</div>
<div class="form-group">
    <label for="langSelect">اللغة (Language):</label>
    <select id="langSelect" onchange="updateVoices(); generateCommand();">
        <option value="ar" selected>العربية (ARB)</option>
        <option value="en">الإنجليزية (ENG)</option>
    </select>
</div>
<div class="form-group">
    <label for="voiceSelect">المؤدي الصوتي:</label>
    <select id="voiceSelect" onchange="generateCommand()">
        <!-- سيتم تعبئتها ديناميكياً -->
    </select>
</div>
<div class="form-group">
    <label for="albumSelect">Album:</label>
    <select id="albumSelect" onchange="generateCommand()">
        <option value="ModsLib">ModsLib</option>
        <option value="Cj Legend">Cj Legend</option>
        <option value="BlockFoundry" selected>BlockFoundry</option>
    </select>
</div>
<div class="form-group">
    <label for="yearSelect">Year:</label>
    <select id="yearSelect" onchange="generateCommand()"></select>
</div>
<div class="form-group">
    <label for="trackInput">Track:</label>
    <input type="number" id="trackInput" min="1" placeholder="رقم المسار" oninput="generateCommand()">
</div>
<div class="output-box">
    <label>الأمر الناتج:</label>
    <pre id="commandOutput"></pre>
    <button class="btn" id="copyBtn" onclick="copyCommand()">نسخ الأمر تلقائياً</button>
</div>
</div>
<script>
    const voicesData = {
        ar: [
            { value: "ar-SA-HamedNeural", label: "السعودي - Hamed" },
            { value: "ar-SA-ZariyahNeural", label: "السعودية - Zariyah" },
            { value: "ar-EG-SalmaNeural", label: "المصري - Salma" },
            { value: "ar-EG-ShakirNeural", label: "المصري - Shakir" },
            { value: "ar-AE-FatimaNeural", label: "الإماراتي - Fatima" },
            { value: "ar-JO-SanaNeural", label: "الأردني - Sana" }
        ],
        en: [
            { value: "en-US-AriaNeural", label: "أمريكي - Aria" },
            { value: "en-US-GuyNeural", label: "أمريكي - Guy" },
            { value: "en-US-JennyNeural", label: "أمريكي - Jenny" },
            { value: "en-GB-RyanNeural", label: "بريطاني - Ryan" },
            { value: "en-GB-SoniaNeural", label: "بريطاني - Sonia" },
            { value: "en-AU-NatashaNeural", label: "أسترالي - Natasha" }
        ]
    };

    const yearSelect = document.getElementById("yearSelect");
    const currentYear = 2026;
    for (let year = currentYear; year <= 2050; year++) {
        const option = document.createElement("option");
        option.value = year; option.textContent = year;
        if (year === currentYear) option.selected = true;
        yearSelect.appendChild(option);
    }

    function updateVoices() {
        const lang = document.getElementById("langSelect").value;
        const voiceSelect = document.getElementById("voiceSelect");
        voiceSelect.innerHTML = "";
        
        voicesData[lang].forEach(v => {
            const option = document.createElement("option");
            option.value = v.value;
            option.textContent = v.label;
            voiceSelect.appendChild(option);
        });
    }

    function generateCommand() {
        const text = document.getElementById("textInput").value.trim();
        const fileName = document.getElementById("fileNameInput").value.trim();
        const voice = document.getElementById("voiceSelect").value;
        const album = document.getElementById("albumSelect").value;
        const year = document.getElementById("yearSelect").value;
        const track = document.getElementById("trackInput").value.trim();
        const output = document.getElementById("commandOutput");
        
        if (!text || !fileName) { output.textContent = "اكتب النص واسم الملف لتوليد الأمر..."; return; }
        
        const safeText = text.replace(/"/g, '\\"');
        const cleanFileName = fileName.replace(/\.mp3$/i, "").replace(/[\/\\:*?"<>|]/g, "");
        const single = cleanFileName.replace(/_/g, " ").trim();
        
        const audioDir = `/sdcard/Download/Audio`;
        const tempFile = `${audioDir}/${cleanFileName}_temp.mp3`;
        const finalFile = `${audioDir}/${cleanFileName}.mp3`;
        const coverFile = `/sdcard/Download/cover.jpg`;
        
        let command = `mkdir -p "${audioDir}" && edge-tts --voice "${voice}" --volume="+300%" --text "${safeText}" --write-media "${tempFile}"`;
        command += ` && ffmpeg -y -i "${tempFile}" -i "${coverFile}" -map 0:a:0 -map 1:v:0 -c:a copy -c:v mjpeg -metadata "artist=Artist" -metadata "album=${album}" -metadata "title=${single}" -metadata "date=${year}" -metadata "genre=Vocals"`;
        if (track) command += ` -metadata "track=${track}"`;
        command += ` -id3v2_version 3 "${finalFile}"`;
        command += ` && rm "${tempFile}"`;
        
        output.textContent = command;
    }

    function copyCommand() {
        const commandText = document.getElementById("commandOutput").textContent;
        if (!commandText || commandText === "اكتب النص واسم الملف لتوليد الأمر...") return;
        navigator.clipboard.writeText(commandText).then(() => {
            const btn = document.getElementById("copyBtn");
            btn.textContent = "تم النسخ بنجاح! ✅"; btn.classList.add("btn-success");
            setTimeout(() => { btn.textContent = "نسخ الأمر تلقائياً"; btn.classList.remove("btn-success"); }, 2000);
        });
    }

    updateVoices();
    generateCommand();
</script>
</body>
</html>
