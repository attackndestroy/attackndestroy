<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ATT/DES Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #131b2e;
      --border-color: #1e2d4a;
      --accent-yellow: #f59e0b;
      --accent-yellow-light: #fbbf24;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }

    header {
      text-align: center;
      padding-bottom: 15px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .header-img {
      max-width: 100%;
      height: auto;
      max-height: 120px;
      object-fit: contain;
      margin-bottom: 8px;
    }

    .empire-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent-yellow);
      margin: 0 0 10px 0;
      letter-spacing: 0.5px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .live-badge {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-yellow-light);
      border: 1px solid var(--accent-yellow);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
    }

    .card-title {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-bottom: 6px;
    }

    .card-value {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent-yellow-light);
    }

    .chart-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .chart-title {
      font-size: 0.95rem;
      color: var(--text-main);
      margin-bottom: 15px;
      font-weight: bold;
    }

    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 15px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      text-align: right;
      white-space: nowrap;
    }

    th {
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
      padding: 10px;
      font-weight: 600;
    }

    td {
      padding: 12px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .highlight {
      color: var(--accent-yellow);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <img src="https://attdes.online/header.png" alt="ATT/DES Header" class="header-img" onerror="this.style.display='none'">
    <p class="empire-title">دامت الإمبراطورية خالدة 👑🔥</p>
    <div class="status-bar">
      <span style="color: var(--text-muted); font-size: 0.85rem;">ATT/DES Analytics 🚚</span>
      <span class="live-badge">● مباشر</span>
    </div>
  </header>

  <div class="kpi-grid">
    <div class="card">
      <div class="card-title">إجمالي الجلسات</div>
      <div class="card-value" id="stat-sessions">0</div>
    </div>
    <div class="card">
      <div class="card-title">المواقع</div>
      <div class="card-value" id="stat-sites">0</div>
    </div>
    <div class="card">
      <div class="card-title">الأحداث</div>
      <div class="card-value" id="stat-events">0</div>
    </div>
  </div>

  <div class="chart-container">
    <div class="chart-title">نشاط الجلسات عبر الزمن</div>
    <canvas id="trafficChart" height="120"></canvas>
  </div>

  <div class="table-container">
    <div class="chart-title">سجل الجلسات المباشرة</div>
    <table>
      <thead>
        <tr>
          <th>النطاق</th>
          <th>المعرف</th>
          <th>الجهاز</th>
          <th>المتصفح</th>
          <th>النظام</th>
          <th>المدة</th>
          <th>التاريخ</th>
        </tr>
      </thead>
      <tbody id="sessions-list"></tbody>
    </table>
  </div>

  <script>
    const SUPABASE_URL = "https://jphbbwvncyxwaforfrnx.supabase.co";
    const SUPABASE_KEY = "sb_publishable_OgE_7eKXWZzYqeRe1uLKWQ_z9kzwJEY";

    let trafficChart;

    async function fetchREST(endpoint) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      });
      return res.json();
    }

    function initChart(labels, data) {
      const ctx = document.getElementById('trafficChart').getContext('2d');
      if (trafficChart) trafficChart.destroy();

      trafficChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'الجلسات',
            data: data,
            borderColor: '#f59e0b',
            backgroundColor: 'rgba(245, 158, 11, 0.15)',
            fill: true,
            tension: 0.4,
            borderWidth: 2,
            pointRadius: 4,
            pointBackgroundColor: '#fbbf24'
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: '#1e2d4a' }, ticks: { color: '#94a3b8' } },
            y: { grid: { color: '#1e2d4a' }, ticks: { color: '#94a3b8' }, beginAtZero: true }
          }
        }
      });
    }

    async function loadDashboard() {
      try {
        const [sessions, sites, events] = await Promise.all([
          fetchREST("sessions?select=*,sites(domain)&order=created_at.desc"),
          fetchREST("sites?select=site_id"),
          fetchREST("events?select=event_id")
        ]);

        document.getElementById('stat-sessions').innerText = Array.isArray(sessions) ? sessions.length : 0;
        document.getElementById('stat-sites').innerText = Array.isArray(sites) ? sites.length : 0;
        document.getElementById('stat-events').innerText = Array.isArray(events) ? events.length : 0;

        const timeMap = {};
        if (Array.isArray(sessions)) {
          sessions.forEach(s => {
            const timeKey = new Date(s.created_at).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
            timeMap[timeKey] = (timeMap[timeKey] || 0) + 1;
          });
        }

        const labels = Object.keys(timeMap).reverse();
        const chartData = Object.values(timeMap).reverse();
        initChart(labels.length ? labels : ['الآن'], chartData.length ? chartData : [0]);

        const tbody = document.getElementById('sessions-list');
        tbody.innerHTML = '';

        if (Array.isArray(sessions) && sessions.length > 0) {
          sessions.forEach(s => {
            tbody.innerHTML += `<tr>
              <td class="highlight">${s.sites ? s.sites.domain : 'attdes.online'}</td>
              <td>${s.visitor_id ? s.visitor_id.substring(0, 8) : '---'}</td>
              <td>${s.device || 'Mobile'}</td>
              <td>${s.browser || 'Chrome'}</td>
              <td>${s.os || 'Android'}</td>
              <td>${s.duration || 0}ث</td>
              <td>${new Date(s.created_at).toLocaleTimeString('ar-EG')}</td>
            </tr>`;
          });
        } else {
          tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--text-muted);">لا توجد جلسات مسجلة بعد</td></tr>`;
        }
      } catch (err) {
        console.error("Fetch Error:", err);
      }
    }

    loadDashboard();
    setInterval(loadDashboard, 15000); // تحديث تلقائي كل 15 ثانية
  </script>
</body>
</html>
