<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد أوامر Edge-TTS</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-align: center;
            color: #818cf8;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        .output-box {
            margin-top: 24px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            position: relative;
        }
        pre {
            white-space: pre-wrap;
            word-break: break-all;
            font-family: monospace;
            font-size: 0.9rem;
            color: #38bdf8;
            margin-bottom: 12px;
        }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: var(--primary-hover);
        }
        .btn-success {
            background-color: #10b981 !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>مولد أوامر Edge-TTS</h2>
        
        <div class="form-group">
            <label for="textInput">النص المراد تحويله:</label>
            <textarea id="textInput" placeholder="اكتب النص هنا..." oninput="generateCommand()">مرحباً بك في أداة توليد الصوت.</textarea>
        </div>

        <div class="form-group">
            <label for="fileNameInput">اسم الملف (بدون صيغة):</label>
            <input type="text" id="fileNameInput" value="my_audio" oninput="generateCommand()">
        </div>

        <div class="form-group">
            <label for="voiceSelect">اختر المؤدي الصوتي:</label>
            <select id="voiceSelect" onchange="generateCommand()">
                <option value="ar-SA-HamedNeural">السعودي - حamed (Hamed)</option>
                <option value="ar-SA-ZariyahNeural">السعودية - زارية (Zariyah)</option>
                <option value="ar-EG-SalmaNeural">المصري - سلمى (Salma)</option>
                <option value="ar-EG-ShakirNeural">المصري - شاكر (Shakir)</option>
                <option value="ar-AE-FatimaNeural">الإماراتي - فاطمة (Fatima)</option>
                <option value="ar-JO-SanaNeural">الأردني - سناء (Sana)</option>
            </select>
        </div>

        <div class="output-box">
            <label>الأمر الناتج:</label>
            <pre id="commandOutput"></pre>
            <button class="btn" id="copyBtn" onclick="copyCommand()">نسخ الأمر تلقائياً</button>
        </div>
    </div>

    <script>
        function generateCommand() {
            const text = document.getElementById('textInput').value.trim() || "اكتب النص هنا";
            const fileName = document.getElementById('fileNameInput').value.trim() || "audio";
            const voice = document.getElementById('voiceSelect').value;
            
            // تنظيف النص من علامات التنصيص المزدوجة لكي لا تفسد الأمر في التيرمنال
            const safeText = text.replace(/"/g, '\\"');

            const command = `edge-tts --voice "${voice}" --volume="+300%" --text "${safeText}" --write-media "/sdcard/ATTDES/Audio/${fileName}.mp3"`;
            
            document.getElementById('commandOutput').textContent = command;
        }

        function copyCommand() {
            const commandText = document.getElementById('commandOutput').textContent;
            navigator.clipboard.writeText(commandText).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.textContent = "تم النسخ بنجاح! ✅";
                btn.classList.add('btn-success');
                
                setTimeout(() => {
                    btn.textContent = "نسخ الأمر تلقائياً";
                    btn.classList.remove('btn-success');
                }, 2000);
            });
        }

        // توليد الأمر لأول مرة عند فتح الصفحة
        generateCommand();
    </script>

</body>
</html>
