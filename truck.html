<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ATT/DES Analytics - Truck Dashboard 🚚</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #131b2e;
      --border-color: #1e2d4a;
      --accent-yellow: #f59e0b;
      --accent-yellow-light: #fbbf24;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    h1 {
      font-size: 1.4rem;
      margin: 0;
      color: var(--accent-yellow);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-badge {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-yellow-light);
      border: 1px solid var(--accent-yellow);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
    }

    .card-title {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-bottom: 6px;
    }

    .card-value {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent-yellow-light);
    }

    .chart-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
      position: relative;
    }

    .chart-title {
      font-size: 0.95rem;
      color: var(--text-main);
      margin-bottom: 15px;
      font-weight: bold;
    }

    .breakdown-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 15px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      text-align: right;
      white-space: nowrap;
    }

    th {
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
      padding: 10px;
      font-weight: 600;
    }

    td {
      padding: 12px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .highlight {
      color: var(--accent-yellow);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <h1>ATT/DES Analytics 🚚</h1>
    <span class="live-badge">● مباشر</span>
  </header>

  <!-- الكروت الرئيسية GA style -->
  <div class="kpi-grid">
    <div class="card">
      <div class="card-title">إجمالي الجلسات</div>
      <div class="card-value" id="stat-sessions">0</div>
    </div>
    <div class="card">
      <div class="card-title">المواقع</div>
      <div class="card-value" id="stat-sites">0</div>
    </div>
    <div class="card">
      <div class="card-title">الأحداث</div>
      <div class="card-value" id="stat-events">0</div>
    </div>
  </div>

  <!-- رسم بياني لعدد الجلسات -->
  <div class="chart-container">
    <div class="chart-title">نشاط الجلسات عبر الزمن</div>
    <canvas id="trafficChart" height="120"></canvas>
  </div>

  <!-- الجداول والتوزيع السريع -->
  <div class="table-container">
    <div class="chart-title">سجل الجلسات المباشرة</div>
    <table>
      <thead>
        <tr>
          <th>النطاق</th>
          <th>المعرف</th>
          <th>الجهاز</th>
          <th>المتصفح</th>
          <th>النظام</th>
          <th>المدة</th>
          <th>التاريخ</th>
        </tr>
      </thead>
      <tbody id="sessions-list"></tbody>
    </table>
  </div>

  <script>
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let trafficChart;

    function initChart(labels, data) {
      const ctx = document.getElementById('trafficChart').getContext('2d');
      if (trafficChart) trafficChart.destroy();

      trafficChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'الجلسات',
            data: data,
            borderColor: '#f59e0b',
            backgroundColor: 'rgba(245, 158, 11, 0.1)',
            fill: true,
            tension: 0.4,
            borderWidth: 2,
            pointRadius: 3,
            pointBackgroundColor: '#fbbf24'
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: '#1e2d4a' }, ticks: { color: '#94a3b8' } },
            y: { grid: { color: '#1e2d4a' }, ticks: { color: '#94a3b8' }, beginAtZero: true }
          }
        }
      });
    }

    async function loadDashboard() {
      const { data: sessions } = await supabaseClient.from('sessions').select('*, sites(domain)').order('created_at', { ascending: false });
      const { data: sites } = await supabaseClient.from('sites').select('site_id');
      const { data: events } = await supabaseClient.from('events').select('event_id');

      document.getElementById('stat-sessions').innerText = sessions ? sessions.length : 0;
      document.getElementById('stat-sites').innerText = sites ? sites.length : 0;
      document.getElementById('stat-events').innerText = events ? events.length : 0;

      // تجميع البيانات للرسم البياني
      const timeMap = {};
      (sessions || []).forEach(s => {
        const timeKey = new Date(s.created_at).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        timeMap[timeKey] = (timeMap[timeKey] || 0) + 1;
      });

      const labels = Object.keys(timeMap).reverse();
      const chartData = Object.values(timeMap).reverse();
      initChart(labels, chartData);

      // بناء الجدول
      const tbody = document.getElementById('sessions-list');
      tbody.innerHTML = '';
      (sessions || []).forEach(s => {
        tbody.innerHTML += `<tr>
          <td class="highlight">${s.sites ? s.sites.domain : 'Main'}</td>
          <td>${s.visitor_id.substring(0, 8)}</td>
          <td>${s.device}</td>
          <td>${s.browser}</td>
          <td>${s.os}</td>
          <td>${s.duration}ث</td>
          <td>${new Date(s.created_at).toLocaleTimeString('ar-EG')}</td>
        </tr>`;
      });
    }

    loadDashboard();
    setInterval(loadDashboard, 30000); // تحديث تلقائي كل 30 ثانية
  </script>
</body>
</html>
